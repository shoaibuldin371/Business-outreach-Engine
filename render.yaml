services:
  - type: web
    name: business-outreach-engine-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_EMAIL
        value: Mshoaibawan371@gmail.com
      - key: AUTOMATION_INTERVAL_HOURS
        value: 3
      - key: DEFAULT_CATEGORY
        value: dentists
      - key: DEFAULT_CITY
        value: Dallas, TX
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
