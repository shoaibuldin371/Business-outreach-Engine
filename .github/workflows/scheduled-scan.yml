name: Twice-Daily Autonomous Cloud Outreach Scan

on:
  schedule:
    # Runs twice daily at 08:00 and 20:00 UTC (100% Free, runs 24/7 in the cloud while laptop is off)
    - cron: '0 8,20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-outreach-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Twice-Daily Cloud Outreach Discovery Scan
        run: |
          echo "Triggering twice-daily cloud outreach discovery scan on live Vercel production..."
          curl -s -X POST https://business-outreach-engine.vercel.app/api/cron/trigger?secret=outreach_scheduled_secret_9941 \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer outreach_scheduled_secret_9941" \
            -d '{"count": 6}' | jq .

